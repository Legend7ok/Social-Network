services:
  db:
    image: postgres:17-alpine
    container_name: social-network-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: web
    command: python app/manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  test:
    build:
      context: .
      target: test
    command: run-tests
    profiles:
      - test
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    build:
      context: .
      target: web
    command: celery -A config worker -l info
    environment:
      PYTHONPATH: /app/app
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  ngrok:
    image: ngrok/ngrok:latest
    command: http web:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - web

volumes:
  postgres_data:
  media:
  redis_data:
