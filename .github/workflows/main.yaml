name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests and Linters
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialnetwork
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 3. Set up Python
        run: uv python install 3.13

      - name: 4. Install dependencies
        run: uv sync --extra dev

      - name: 5. Check code style (Ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: 6. Run Django tests
        env:
          SECRET_KEY: "ci-test-key-only"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/socialnetwork"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          PYTHONPATH: app
          DJANGO_SETTINGS_MODULE: settings.test
        run: uv run pytest --cov --cov-report=xml

      - name: 7. Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
