name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A second push to the same branch makes the first run pointless; cancel it
# instead of paying for both and waiting behind the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Neither of these needs a database or a queue, so this job starts instantly
  # instead of waiting for containers to become healthy.
  checks:
    name: Lint and migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to the full version on purpose: since v8 this action stopped
        # publishing a moving @v10 tag, and a bare major would not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check code style
        run: uv run ruff check . && uv run ruff format --check .

      # Catches a model changed without its migration written: the branch would
      # pass every test and then fail on deploy, where the schema no longer
      # matches the code.
      - name: Check for missing migrations
        env:
          SECRET_KEY: "ci-test-key-only"
          PYTHONPATH: app
          DJANGO_SETTINGS_MODULE: settings.test
        run: uv run python app/manage.py makemigrations --check --dry-run

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialnetwork
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to the full version on purpose: since v8 this action stopped
        # publishing a moving @v10 tag, and a bare major would not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Django tests
        env:
          SECRET_KEY: "ci-test-key-only"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/socialnetwork"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          PYTHONPATH: app
          DJANGO_SETTINGS_MODULE: settings.test
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

  # Builds what production actually runs. Nothing above touches the image, so
  # without this a broken Dockerfile — or a frontend that no longer builds —
  # only shows up when the stack is started.
  image:
    name: Production image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --target web -t socnet:ci .

      - name: Check it starts and sees its settings
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-test-key-only \
            -e ALLOWED_HOSTS=localhost \
            -e CSRF_TRUSTED_ORIGINS=http://localhost \
            -e DATABASE_URL=postgresql://u:p@db:5432/x \
            -e REDIS_PASSWORD=ci \
            -e RESEND_API_KEY=ci \
            -e DEFAULT_FROM_EMAIL=ci@example.com \
            -e SERVER_EMAIL=ci@example.com \
            -e R2_ACCOUNT_ID=ci \
            -e R2_BUCKET_NAME=ci \
            -e R2_ACCESS_KEY_ID=ci \
            -e R2_SECRET_ACCESS_KEY=ci \
            -e DJANGO_SETTINGS_MODULE=settings.prod \
            socnet:ci python app/manage.py check
