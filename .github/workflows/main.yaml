name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests and Linters
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Включаем кеширование, чтобы повторные запуски были мгновенными
          enable-cache: true

      - name: 3. Set up Python
        run: uv python install 3.13

      - name: 4. Install dependencies
        # uv sync установит всё строго по твоему uv.lock
        run: uv sync --extra dev

      - name: 5. Check code style (Ruff)
        # Ruff — это современный линтер, он очень быстрый
        run: uv run ruff check .

      - name: 6. Run Django tests
        # Передаем переменные окружения, чтобы Django запустился без .env файла
        env:
          SECRET_KEY: "ci-test-key-only"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: uv run pytest
