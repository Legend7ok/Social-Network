# Preserve the original scheme from the TLS terminator in front (e.g. ngrok),
# falling back to $scheme for direct http access. Without this, proxying always
# reports http to Django -> request.is_secure() is False -> SECURE_SSL_REDIRECT
# loops forever and HSTS is never sent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The name here is resolved once, when nginx starts. A container keeps its
# address across a restart but gets a new one when it is recreated, so after a
# deploy that replaces the web container nginx keeps dialling the old address
# and answers 502 until it is restarted itself - which is why the deploy
# procedure ends by restarting it (make prod-deploy).
#
# The alternative, an address held in a variable, is re-resolved on every
# request but cannot be combined with the keepalive below: free nginx offers
# one or the other, and reusing connections is worth more than saving a restart
# that a deploy performs anyway.
upstream gunicorn {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Take the visitor's address from the forwarded header, trusting only the
    # container network - that is where the tunnel sits. Without this every
    # visitor arriving through the tunnel would look like the same address, and
    # one of them could use up everyone's rate limit.
    #
    # The catch, stated plainly: published ports arrive from the same network
    # through docker's own forwarder, so while port 80 is open to the outside
    # anyone reaching it directly can name any address in that header. Locally
    # that is nobody. On a real server, put this behind a proxy you control and
    # narrow the ranges below to its address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers are owned by Django (settings/prod.py), not duplicated here.

    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # One address, worked out above, instead of appending to whatever the
        # client sent. The rate limiter counts by this header, and the appending
        # form let anyone hand it a different address on every request.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Both lines are needed for the keepalive above to do anything: without
        # them nginx speaks HTTP/1.0 upstream and closes the connection after
        # every request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}

