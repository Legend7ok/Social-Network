# Preserve the original scheme from the TLS terminator in front (e.g. ngrok),
# falling back to $scheme for direct http access. Without this, proxying always
# reports http to Django -> request.is_secure() is False -> SECURE_SSL_REDIRECT
# loops forever and HSTS is never sent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream gunicorn {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security headers are owned by Django (settings/prod.py), not duplicated here.

    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
