{% extends "base.html" %}

{% block title %}Service Unavailable · socnet{% endblock %}

{% block content %}
<div class="px-[16px] lg:px-[31px] py-[31px] flex justify-start">
  <div class="w-full max-w-[528px] flex flex-col gap-[22px]">

    <div class="flex items-center gap-[13px]">
      <div class="w-11 h-11 rounded-full bg-red-900/40 border border-red-700/40 flex items-center justify-center shrink-0">
        <i class="ti ti-server-off text-[20px] text-red-400"></i>
      </div>
      <h1 class="text-[20px] font-medium text-white">Technical issue</h1>
    </div>

    <p class="text-[14px] text-[#9896A4]">
      Something went wrong on our end.<br>
      Please try again later.
    </p>

    <a href="javascript:history.back()"
       class="flex items-center gap-[9px] px-[35px] py-[13px] rounded-xl text-[15px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
      <i class="ti ti-arrow-left text-[18px]"></i>
      Go back
    </a>

  </div>
</div>
{% endblock %}
