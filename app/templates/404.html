{% extends "base_narrow.html" %}

{% block title %}Page Not Found · socnet{% endblock %}

{% block panel %}

<div class="flex items-center gap-[13px]">
  <div class="w-11 h-11 rounded-full bg-surface-input border border-white/[0.15] flex items-center justify-center shrink-0">
    <i class="ti ti-map-pin-off text-[20px] text-[#9896A4]"></i>
  </div>
  <h1 class="text-[20px] font-medium text-white">Page not found</h1>
</div>

<p class="text-[14px] text-[#9896A4]">
  There is nothing at this address. The page may have been removed, or the link
  that brought you here may be out of date.
</p>

<div class="flex flex-wrap items-center gap-[18px]">
  <a href="javascript:history.back()"
     class="flex items-center gap-[9px] px-[35px] py-[13px] rounded-xl text-[15px] font-medium bg-brand text-white hover:opacity-90 transition-all">
    <i class="ti ti-arrow-left text-[18px]"></i>
    Go back
  </a>
  <a href="{% url 'home' %}" class="text-[13px] text-brand-light hover:underline">
    Go to the feed
  </a>
</div>

{% endblock %}
