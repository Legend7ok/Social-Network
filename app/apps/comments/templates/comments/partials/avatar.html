{% load thumbnail user_display %}
<a href="{% url 'user_detail' person.username %}"
   title="{{ person|display_name }}"
   class="w-[35px] h-[35px] rounded-full bg-brand/30 flex items-center justify-center text-[12px] font-medium text-brand-light overflow-hidden border border-white/[0.08] hover:border-brand/40 transition-colors shrink-0">
  {% if person.profile.photo %}
    {% thumbnail person.profile.photo THUMBS.avatar_md crop="center" as av %}
    <img src="{{ av.url }}" class="w-full h-full object-cover" alt="{{ person|display_name }}" />
    {% endthumbnail %}
  {% else %}
    {{ person|initials }}
  {% endif %}
</a>
