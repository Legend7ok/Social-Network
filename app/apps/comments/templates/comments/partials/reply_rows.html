{% comment %}
  The rest of a thread, a page at a time. The button swaps itself for the
  next page when it is pressed.
{% endcomment %}
{% for reply in replies %}
  {% include 'comments/partials/reply.html' %}
{% endfor %}

{% if has_next %}
<button type="button"
        hx-get="{% url 'comments:thread' root.id %}?page={{ next_page }}"
        hx-swap="outerHTML"
        hx-disabled-elt="this"
        class="self-start text-[13px] text-brand-light hover:underline disabled:opacity-60">
  Show more replies
</button>
{% endif %}
