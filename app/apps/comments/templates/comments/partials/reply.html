{% load user_display %}
<article id="comment-{{ reply.id }}" class="flex gap-[11px]">
  {% include 'comments/partials/avatar.html' with person=reply.user small=True %}

  <div class="min-w-0 flex-1">
    <div class="flex items-baseline gap-[9px] min-w-0">
      <a href="{% url 'user_detail' reply.user.username %}"
         class="text-[14px] font-medium text-white hover:text-brand-light transition-colors truncate">
        {{ reply.user|display_name }}
      </a>
      <span class="text-[12px] text-[#5E5C6A] shrink-0">{{ reply.created|timesince }} ago</span>
    </div>
    <p class="mt-[3px] text-[14px] text-[#9896A4] leading-relaxed break-words">{{ reply.body|linebreaksbr }}</p>
    {% if request.user.is_authenticated and not root.removed_at %}
      <button type="button" @click="open('{{ reply.user.username|escapejs }}')"
              class="mt-[5px] text-[13px] text-[#5E5C6A] hover:text-white transition-colors">
        Reply
      </button>
    {% endif %}
  </div>
</article>
