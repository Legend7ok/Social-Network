{% extends "base_narrow.html" %}

{% block title %}Reset Password · socnet{% endblock %}

{% block panel %}

<h1 class="text-[20px] font-medium text-white">Forgot password?</h1>
<p class="text-[14px] text-[#9896A4] -mt-[9px]">Enter your email and we'll send you a reset link.</p>

<form method="post" class="flex flex-col gap-[22px]">
  {% csrf_token %}

  <div>
    <label class="block text-[13px] text-[#9896A4] mb-[7px]">
      Email <span class="text-red-400">*</span>
    </label>
    <input type="email" name="email" autocomplete="email"
           placeholder="john@example.com"
           class="w-full bg-surface-input border rounded-xl text-white text-[14px] px-[18px] py-[11px] outline-none placeholder-[#5E5C6A] transition-colors
                  {% if form.email.errors %}border-red-700/60 focus:border-red-500{% else %}border-white/[0.15] focus:border-brand/60{% endif %}">
    {% for error in form.email.errors %}
      <p class="mt-[7px] text-[13px] text-red-400">{{ error }}</p>
    {% endfor %}
  </div>

  <button type="submit"
          class="flex items-center justify-center gap-[9px] px-[35px] py-[13px] rounded-xl text-[15px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
    <i class="ti ti-send text-[18px]"></i>
    Send reset link
  </button>

</form>

<a href="{% url 'login' %}" class="text-[13px] text-brand-light hover:underline">
  Back to sign in
</a>

{% endblock %}
