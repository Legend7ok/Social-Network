{% extends "base.html" %}

{% block title %}Reset Password · socnet{% endblock %}

{% block content %}
<div class="px-7 py-7 flex justify-start">
  <div class="w-full max-w-[480px] flex flex-col gap-5">

    <h1 class="text-[18px] font-medium text-white">Forgot password?</h1>
    <p class="text-[13px] text-[#9896A4] -mt-2">Enter your email and we'll send you a reset link.</p>

    <form method="post" class="flex flex-col gap-5">
      {% csrf_token %}

      <div>
        <label class="block text-[12px] text-[#9896A4] mb-1.5">
          Email <span class="text-red-400">*</span>
        </label>
        <input type="email" name="email" autocomplete="email"
               placeholder="john@example.com"
               class="w-full bg-surface-input border rounded-xl text-white text-[13px] px-4 py-2.5 outline-none placeholder-[#5E5C6A] transition-colors
                      {% if form.email.errors %}border-red-700/60 focus:border-red-500{% else %}border-white/[0.15] focus:border-brand/60{% endif %}">
        {% for error in form.email.errors %}
          <p class="mt-1.5 text-[12px] text-red-400">{{ error }}</p>
        {% endfor %}
      </div>

      <button type="submit"
              class="flex items-center justify-center gap-2 px-8 py-3 rounded-xl text-[14px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
        <i class="ti ti-send text-[16px]"></i>
        Send reset link
      </button>

    </form>

    <a href="{% url 'login' %}" class="text-[12px] text-brand-light hover:underline">
      Back to sign in
    </a>

  </div>
</div>
{% endblock %}
