{% extends "base.html" %}

{% block title %}Password Reset · socnet{% endblock %}

{% block content %}
<div class="px-7 py-7 flex justify-start">
  <div class="w-full max-w-[480px] flex flex-col gap-5">

    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-green-900/40 border border-green-700/40 flex items-center justify-center shrink-0">
        <i class="ti ti-check text-[18px] text-green-400"></i>
      </div>
      <h1 class="text-[18px] font-medium text-white">Password reset</h1>
    </div>

    <p class="text-[13px] text-[#9896A4]">Your password has been set. You can now sign in with your new password.</p>

    <a href="{% url 'login' %}"
       class="flex items-center gap-2 px-8 py-3 rounded-xl text-[14px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
      <i class="ti ti-login text-[16px]"></i>
      Sign in
    </a>

  </div>
</div>
{% endblock %}
