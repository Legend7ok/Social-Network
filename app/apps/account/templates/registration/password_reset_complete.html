{% extends "base.html" %}

{% block title %}Password Reset · socnet{% endblock %}

{% block content %}
<div class="px-[31px] py-[31px] flex justify-start">
  <div class="w-full max-w-[528px] flex flex-col gap-[22px]">

    <div class="flex items-center gap-[13px]">
      <div class="w-11 h-11 rounded-full bg-green-900/40 border border-green-700/40 flex items-center justify-center shrink-0">
        <i class="ti ti-check text-[20px] text-green-400"></i>
      </div>
      <h1 class="text-[20px] font-medium text-white">Password reset</h1>
    </div>

    <p class="text-[14px] text-[#9896A4]">Your password has been set. You can now sign in with your new password.</p>

    <a href="{% url 'login' %}"
       class="flex items-center gap-[9px] px-[35px] py-[13px] rounded-xl text-[15px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
      <i class="ti ti-login text-[18px]"></i>
      Sign in
    </a>

  </div>
</div>
{% endblock %}
