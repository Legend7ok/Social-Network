{% extends "base_narrow.html" %}

{% block title %}Check Your Email · socnet{% endblock %}

{% block panel %}

<div class="flex items-center gap-[13px]">
  <div class="w-11 h-11 rounded-full bg-brand/20 border border-brand/30 flex items-center justify-center shrink-0">
    <i class="ti ti-mail text-[20px] text-brand-light"></i>
  </div>
  <h1 class="text-[20px] font-medium text-white">Check your email</h1>
</div>

<p class="text-[14px] text-[#9896A4]">
  We've sent instructions for resetting your password. If you don't receive an email, make sure you entered the address you registered with.
</p>

<a href="{% url 'login' %}"
   class="flex items-center gap-[9px] px-[35px] py-[13px] rounded-xl text-[15px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
  <i class="ti ti-arrow-left text-[18px]"></i>
  Back to sign in
</a>

{% endblock %}
