{% extends "base.html" %}

{% block title %}Check Your Email · socnet{% endblock %}

{% block content %}
<div class="px-7 py-7 flex justify-start">
  <div class="w-full max-w-[480px] flex flex-col gap-5">

    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-brand/20 border border-brand/30 flex items-center justify-center shrink-0">
        <i class="ti ti-mail text-[18px] text-brand-light"></i>
      </div>
      <h1 class="text-[18px] font-medium text-white">Check your email</h1>
    </div>

    <p class="text-[13px] text-[#9896A4]">
      We've sent instructions for resetting your password. If you don't receive an email, make sure you entered the address you registered with.
    </p>

    <a href="{% url 'login' %}"
       class="flex items-center gap-2 px-8 py-3 rounded-xl text-[14px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
      <i class="ti ti-arrow-left text-[16px]"></i>
      Back to sign in
    </a>

  </div>
</div>
{% endblock %}
