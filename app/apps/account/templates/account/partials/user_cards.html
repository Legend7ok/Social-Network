{% for profile_user in users %}
  {% include 'account/partials/user_card.html' %}
{% empty %}
  <div class="text-center py-[70px] text-[#5E5C6A]">
    <i class="ti ti-users-off text-[53px] block mb-[13px]"></i>
    <p class="text-[15px]">No users found</p>
  </div>
{% endfor %}

{% if next_cursor %}
{% comment %}Scrolled into view, it swaps itself for the next batch of cards.{% endcomment %}
<div hx-get="{% querystring users_only=1 after=next_cursor %}"
     hx-trigger="intersect once"
     hx-swap="outerHTML"
     hx-indicator="#loading">
</div>
{% endif %}
