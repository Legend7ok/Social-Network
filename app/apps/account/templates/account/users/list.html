{% extends 'base.html' %}

{% block title %}People · socnet{% endblock %}

{% block content %}
<div class="px-[16px] lg:px-[26px] py-[22px]">

  <!-- Tabs -->
  <div class="flex border-b border-white/[0.08] mb-[22px]">
    {# Page is dropped: switching tabs starts the new list from the top. #}
    <a href="{% querystring filter='all' page=None %}"
       class="px-[18px] py-[9px] text-[14px] border-b-2 transition-colors
              {% if not filter or filter == 'all' %}text-brand-light border-brand{% else %}text-[#9896A4] border-transparent hover:text-white{% endif %}">
      All
    </a>
    <a href="{% querystring filter='following' page=None %}"
       class="px-[18px] py-[9px] text-[14px] border-b-2 transition-colors
              {% if filter == 'following' %}text-brand-light border-brand{% else %}text-[#9896A4] border-transparent hover:text-white{% endif %}">
      Following
    </a>
    <a href="{% querystring filter='followers' page=None %}"
       class="px-[18px] py-[9px] text-[14px] border-b-2 transition-colors
              {% if filter == 'followers' %}text-brand-light border-brand{% else %}text-[#9896A4] border-transparent hover:text-white{% endif %}">
      Followers
    </a>
  </div>

  <!-- List -->
  <div class="flex flex-col gap-[11px]">
    {% include 'account/partials/user_cards.html' %}
  </div>

  <div id="loading" class="htmx-indicator flex justify-center py-[26px]">
    <div class="flex items-center gap-[9px]">
      <div class="w-[7px] h-[7px] rounded-full bg-brand animate-pulse"></div>
      <div class="w-[7px] h-[7px] rounded-full bg-brand animate-pulse [animation-delay:150ms]"></div>
      <div class="w-[7px] h-[7px] rounded-full bg-brand animate-pulse [animation-delay:300ms]"></div>
    </div>
  </div>

</div>
{% endblock %}
