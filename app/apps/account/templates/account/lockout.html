{% extends "base_narrow.html" %}

{% block title %}Account Locked · socnet{% endblock %}

{% block panel %}

<div class="flex items-center gap-[13px]">
  <div class="w-11 h-11 rounded-full bg-red-900/40 border border-red-700/40 flex items-center justify-center shrink-0">
    <i class="ti ti-lock text-[20px] text-red-400"></i>
  </div>
  <h1 class="text-[20px] font-medium text-white">Account locked</h1>
</div>

<p class="text-[14px] text-[#9896A4]">
  Too many failed login attempts. Try again in
  <span id="countdown" class="text-white font-medium tabular-nums"></span>.
</p>

<a href="{% url 'login' %}"
   class="flex items-center gap-[9px] px-[35px] py-[13px] rounded-xl text-[15px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
  <i class="ti ti-arrow-left text-[18px]"></i>
  Back to sign in
</a>

{% endblock %}

{% block scripts %}
<script>
  const until = new Date("{{ lockout_until }}");
  const el = document.getElementById('countdown');

  function update() {
    const diff = Math.max(0, Math.floor((until - Date.now()) / 1000));
    const m = Math.floor(diff / 60);
    const s = diff % 60;
    el.textContent = m + ':' + String(s).padStart(2, '0');
    if (diff > 0) setTimeout(update, 1000);
    else el.textContent = '0:00';
  }
  update();
</script>
{% endblock %}
