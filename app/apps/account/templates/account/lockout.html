{% extends "base.html" %}

{% block title %}Account Locked · socnet{% endblock %}

{% block content %}
<div class="px-7 py-7 flex justify-start">
  <div class="w-full max-w-[480px] flex flex-col gap-5">

    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-red-900/40 border border-red-700/40 flex items-center justify-center shrink-0">
        <i class="ti ti-lock text-[18px] text-red-400"></i>
      </div>
      <h1 class="text-[18px] font-medium text-white">Account locked</h1>
    </div>

    <p class="text-[13px] text-[#9896A4]">
      Too many failed login attempts. Try again in
      <span id="countdown" class="text-white font-medium tabular-nums"></span>.
    </p>

    <a href="{% url 'login' %}"
       class="flex items-center gap-2 px-8 py-3 rounded-xl text-[14px] font-medium bg-brand text-white hover:opacity-90 transition-all self-start">
      <i class="ti ti-arrow-left text-[16px]"></i>
      Back to sign in
    </a>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const until = new Date("{{ lockout_until }}");
  const el = document.getElementById('countdown');

  function update() {
    const diff = Math.max(0, Math.floor((until - Date.now()) / 1000));
    const m = Math.floor(diff / 60);
    const s = diff % 60;
    el.textContent = m + ':' + String(s).padStart(2, '0');
    if (diff > 0) setTimeout(update, 1000);
    else el.textContent = '0:00';
  }
  update();
</script>
{% endblock %}
