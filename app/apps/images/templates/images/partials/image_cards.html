{% for image in images %}
  {% include 'images/partials/image_card.html' %}
{% endfor %}

{% if next_cursor %}
{% comment %}Scrolled into view, it swaps itself for the next batch of cards.{% endcomment %}
<div class="col-span-full h-px"
     hx-get="{% querystring images_only=1 after=next_cursor %}"
     hx-trigger="intersect once"
     hx-swap="outerHTML"
     hx-indicator="#loading">
</div>
{% endif %}
