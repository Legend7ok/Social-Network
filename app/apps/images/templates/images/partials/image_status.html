{% load thumbnail %}
{% if image.image %}
<a href="{{ image.image.url }}" target="_blank" rel="noopener noreferrer">
  {% thumbnail image.image "300" as im %}
  <img src="{{ im.url }}" class="block" alt="{{ image.title }}" />
  {% endthumbnail %}
</a>
{% else %}
<div hx-get="{% url 'images:status' image.id %}"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
  <div class="flex items-center justify-center h-64 w-64">
    <div class="flex flex-col items-center gap-3">
      <div class="w-10 h-10 rounded-full border-2 border-brand border-t-transparent animate-spin"></div>
      <span class="text-[13px] text-[#5E5C6A]">Processing...</span>
    </div>
  </div>
</div>
{% endif %}
