{% load thumbnail %}
{% if image.image %}
<a href="{{ image.image.url }}" target="_blank" rel="noopener noreferrer">
  {% thumbnail image.image THUMBS.detail_main as im %}
  <img src="{{ im.url }}" class="block w-full h-auto" alt="{{ image.title }}" />
  {% endthumbnail %}
</a>
{% else %}
<div hx-get="{% url 'images:status' image.id %}"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
  <div class="flex items-center justify-center h-[300px] w-full max-w-[400px]">
    <div class="flex flex-col items-center gap-[13px]">
      <div class="w-11 h-11 rounded-full border-2 border-brand border-t-transparent animate-spin"></div>
      <span class="text-[14px] text-[#5E5C6A]">Processing...</span>
    </div>
  </div>
</div>
{% endif %}
