services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: socialnetwork
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: web
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    command: run-tests
    profiles:
      - test
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  ngrok:
    image: ngrok/ngrok:latest
    command: http web:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - web

volumes:
  postgres_data:
  media:
